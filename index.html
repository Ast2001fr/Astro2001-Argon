<!DOCTYPE html>
<html lang="fr" data-theme="meridien">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080c14">
  <meta name="description" content="Astro2001 · Uranométrie — Planétarium web de haute précision : 5 vues, 871 136 étoiles ATHYG v3.2, 15 618 objets OpenNGC, HiPS DSS2, SGP4, modèle de visibilité Crumey (2014).">
  <title>Astro2001 · Uranométrie — Planétarium &amp; Éphémérides</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
  <div id="app-shell">
    <!-- Fullscreen Interactive Sky & 3D Solar System Canvas -->
    <canvas id="sky-canvas" aria-label="Carte du ciel interactive"></canvas>

    <!-- ====================================================================
         TOP BAR (#topbar) : Brand · Unified Search (⌘K) · 5 Views · FOV · Theme
         ==================================================================== -->
    <header id="topbar" role="banner">
      <div class="topbar-left">
        <div class="brand-mark">
          <svg class="brand-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5 L13.8 9.2 L20.5 11 L13.8 12.8 L12 19.5 L10.2 12.8 L3.5 11 L10.2 9.2 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M3 20.5 Q12 16.5 21 20.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.65"/>
          </svg>
          <div class="brand-titles">
            <span class="brand-title">Astro2001</span>
            <span class="brand-subtitle">Uranométrie v3.5</span>
          </div>
        </div>
      </div>

      <!-- Unified Command & Object Search Bar (⌘K) -->
      <div class="topbar-center">
        <button id="btn-open-cmd" class="search-trigger" title="Rechercher un astre ou une commande (⌘K / Ctrl+K)">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span class="search-placeholder" data-i18n="hud.searchPlaceholder">Chercher un astre, Messier, NGC, étoile ou action…</span>
          <kbd class="search-kbd">⌘K</kbd>
        </button>
      </div>

      <!-- 5 Synchronized Views + FOV Stepper + Night Vision + Share + Theme/Lang -->
      <div class="topbar-right">
        <nav class="view-switcher" role="tablist" aria-label="Vues de la simulation">
          <button class="view-tab active" data-view="terrestrial" role="tab" aria-selected="true" title="Vue terrestre — dôme &amp; horizon (1)">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M3 18h18M5 18a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            <span data-i18n="views.terrestrial">Terrestre</span>
            <kbd>1</kbd>
          </button>
          <button class="view-tab" data-view="celestial" role="tab" aria-selected="false" title="Sphère céleste — globe (2)">
            <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="8" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span data-i18n="views.celestial">Sphère</span>
            <kbd>2</kbd>
          </button>
          <button class="view-tab" data-view="telescope" role="tab" aria-selected="false" title="Télescope — champ circulaire + chercheur (3)">
            <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4" stroke="currentColor" stroke-width="1.4"/></svg>
            <span data-i18n="views.telescope">Oculaire</span>
            <kbd>3</kbd>
          </button>
          <button class="view-tab" data-view="solarsystem" role="tab" aria-selected="false" title="Système solaire — héliocentrique 3D (4)">
            <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><ellipse cx="12" cy="12" rx="8.5" ry="4.5" transform="rotate(-22 12 12)" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span data-i18n="views.solarsystem">Système solaire</span>
            <kbd>4</kbd>
          </button>
          <button class="view-tab" data-view="zenith" role="tab" aria-selected="false" title="Ciel entier — planisphère zénithal 180° (5)">
            <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2" stroke="currentColor" stroke-width="1.4"/></svg>
            <span>Ciel entier</span>
            <kbd>5</kbd>
          </button>
        </nav>

        <!-- FOV Stepper -->
        <div class="fov-chip" title="Champ de vision (cliquer sur la valeur pour réinitialiser à 60°)">
          <button id="fovMinus" class="fov-step" aria-label="Zoomer">+</button>
          <button id="fovVal" class="fov-val mono">65°</button>
          <button id="fovPlus" class="fov-step" aria-label="Dézoomer">−</button>
        </div>

        <!-- Night Vision Red Mode Quick Button -->
        <button id="btn-night-vision" class="icon-top-btn" title="Vision nocturne rouge (préservation de la rhodopsine)">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M20.2 14.8A8.5 8.5 0 0 1 9.2 3.8a8.5 8.5 0 1 0 11 11z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Share Sky View Link -->
        <button id="btn-share-view" class="icon-top-btn" title="Copier le lien de cette vue céleste">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <circle cx="18" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="18" cy="19" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M8.3 10.8l7.4-4.6M8.3 13.2l7.4 4.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>

        <select id="theme-select" class="hud-select" aria-label="Thème visuel" title="Thème visuel">
          <option value="meridien">Méridien</option>
          <option value="classique">Classique</option>
          <option value="observatoire">Observatoire</option>
          <option value="celeste">Céleste</option>
          <option value="almanach">Almanach</option>
          <option value="nocturne">Vision nocturne</option>
        </select>

        <select id="lang-select" class="hud-select lang-select" aria-label="Langue" title="Langue de l'interface">
          <option value="fr">FR</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
          <option value="de">DE</option>
        </select>
      </div>
    </header>

    <!-- ====================================================================
         FLOATING OPTICAL TRAIN PILL (#trainChip) — Top-Left under Topbar
         ==================================================================== -->
    <button id="trainChip" class="train-chip" title="Train optique actif — cliquer pour configurer le télescope et l'oculaire">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <path d="M3 16l11-6 3 5-11 5zM14 10l5-2.5 1.5 2.8-5 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8 17l-2 4M11 16l2 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span id="trainChipText" class="mono">203/2032 · 13 mm → ×156 · 0.52° · pup. 1.3 mm</span>
    </button>

    <!-- ====================================================================
         LEFT GRADUATED VERTICAL RAIL (nav#rail)
         ==================================================================== -->
    <nav id="rail" aria-label="Outils d'observation">
      <button class="rail-btn" data-open-panel="tonight" title="Éphémérides &amp; Visibilité de la nuit">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <path d="M3 18h18M4 15c3.5-7 7.5-9 11-4s4 3 5 1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="11" cy="9" r="1.8" fill="currentColor"/>
        </svg>
        <span class="rail-label">La nuit</span>
      </button>

      <button class="rail-btn" data-open-panel="layers" title="Calques, profils d'affichage, Voie lactée &amp; HiPS DSS2">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <path d="M12 3L3 8l9 5 9-5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="rail-label">Calques</span>
      </button>

      <button class="rail-btn" data-open-panel="telescope" title="Matériel : 12 marques, 78 télescopes, 10 oculaires">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 4v3M12 17v3M4 12h3M17 12h3" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <span class="rail-label">Matériel</span>
      </button>

      <button class="rail-btn" data-open-panel="location" title="Lieu (33 848 villes, Bortle 1–9) &amp; Mon horizon 360°">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <path d="M12 21s-6.5-5.8-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.2-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="rail-label">Lieu</span>
      </button>

      <button class="rail-btn" data-open-panel="horizon" title="Mon horizon : masque d'obstruction 360° &amp; règle à bras tendu">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <path d="M2 19h20M2 16l5-6 4 4 5-7 6 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="rail-label">Horizon</span>
      </button>

      <button class="rail-btn" data-open-panel="weather" title="Météo astronomique Open-Meteo (48 h)">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <path d="M7.5 18.5h9a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.3 9.2 3.8 3.8 0 0 0 7.5 18.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="rail-label">Météo</span>
      </button>

      <button class="rail-btn" data-open-panel="satellites" title="ISS &amp; 177 satellites brillants en SGP4 (passages sur 4 jours)">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <rect x="9.5" y="9.5" width="5" height="5" rx="1" transform="rotate(45 12 12)" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5.5 5.5l3.2 3.2M15.3 15.3l3.2 3.2M4 8l4-4M16 20l4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="rail-label">ISS / Sat</span>
      </button>

      <button class="rail-btn" data-open-panel="events" title="Éclipses, 13 essaims de météores &amp; calendrier d'événements">
        <svg viewBox="0 0 24 24" width="19" height="19">
          <circle cx="11" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M13.5 6a6.5 6.5 0 0 0 0 12" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span class="rail-label">Éclipses</span>
      </button>

      <div class="rail-spacer"></div>

      <button class="rail-btn" data-open-panel="offline" title="Hors ligne (PWA) &amp; Paquets Wikipédia">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 4v10m0 0l-3.5-3.5M12 14l3.5-3.5M4 18h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="rail-label">PWA</span>
      </button>

      <button class="rail-btn" data-open-panel="manual" title="Manuel &amp; raccourcis clavier">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M9.8 9.5a2.3 2.3 0 1 1 3.4 2c-.9.5-1.2 1-1.2 2M12 16.8h.01" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span class="rail-label">Aide</span>
      </button>
    </nav>

    <!-- ====================================================================
         NON-MODAL LEFT SLIDE-OVER DRAWER (aside#modal-overlay.left-drawer)
         Never blocks the sky canvas with a fullscreen backdrop!
         ==================================================================== -->
    <aside id="modal-overlay" class="left-drawer hidden" aria-label="Panneau d'instruments">
      <div class="modal-card">
        <header class="modal-header">
          <h3 id="modal-title">Panneau</h3>
          <button id="modal-close-btn" class="icon-close-btn" aria-label="Fermer le panneau" title="Fermer (Échap)">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div id="modal-body" class="modal-body"></div>
      </div>
      <button id="drawer-fold-btn" class="drawer-fold-handle" title="Replier le tiroir">‹</button>
    </aside>

    <!-- ====================================================================
         RIGHT INSPECTOR — OBJECT CARD (« Verdict d'abord » + 6 sections)
         ==================================================================== -->
    <aside id="object-card-drawer" class="object-card hidden" aria-label="Fiche d'objet céleste"></aside>

    <!-- ====================================================================
         BOTTOM ASTRONOMICAL TIME DOCK (footer#timebar.dock)
         ==================================================================== -->
    <footer id="timebar" class="dock" role="contentinfo">
      <!-- Left: Observer Location + Tabular Clock + Date/Twilight Context -->
      <div class="dock-left">
        <button id="btn-open-location" class="ctx-chip" title="Changer le lieu d'observation ou la classe Bortle">
          <span class="ctx-top">
            <svg viewBox="0 0 24 24" width="12" height="12"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <strong id="locName">Paris</strong>
            <span id="wxChip" class="wx-pill" title="Météo astronomique Open-Meteo">48h</span>
          </span>
          <span id="locSub" class="ctx-sub mono">48.9°N 2.4°E · Bortle 4</span>
        </button>

        <button id="hud-time-readout" class="dock-clock-btn" title="Choisir une date et une heure exactes">
          <span id="clockVal" class="clock-val mono">21:45:00</span>
          <span id="lstVal" class="lst-val mono">TSL 22h14m</span>
        </button>
        <input type="datetime-local" id="date-picker-hidden" class="sr-only" aria-label="Choisir date et heure">

        <button id="btn-open-tonight-chip" class="ctx-chip" title="Ouvrir les éphémérides de la nuit">
          <span id="dateVal" class="ctx-top mono">21 oct. 2026</span>
          <span id="nightSub" class="ctx-sub">Nuit noire · Lune 42%</span>
        </button>
      </div>

      <!-- Center: Transport + Noon-to-Noon Interactive SVG Night Track -->
      <div class="dock-center">
        <button id="btn-time-play" class="dock-play active" title="Lecture / Pause (Espace)" aria-label="Lecture ou Pause"></button>
        <button id="btn-day-prev" class="dock-step-day" title="Reculer d'une nuit (−24 h)">‹ 1 j</button>

        <div id="dockTrack" class="dock-track" title="Frise crépusculaire midi → midi (glisser pour faire défiler la nuit)">
          <svg id="dockSvg" viewBox="0 0 360 34" preserveAspectRatio="none"></svg>
        </div>

        <button id="btn-day-next" class="dock-step-day" title="Avancer d'une nuit (+24 h)">1 j ›</button>
      </div>

      <!-- Right: Stepper (−1h / Maintenant / +1h) & Speed Selector -->
      <div class="dock-right">
        <div class="dock-stepper">
          <button id="btn-time-step-back" class="dock-btn mono" title="Reculer d'une heure ([)">−1 h</button>
          <button id="btn-time-now" class="dock-btn now-btn" title="Revenir à l'instant présent (J)" data-i18n="time.now">Maintenant</button>
          <button id="btn-time-step-fwd" class="dock-btn mono" title="Avancer d'une heure (])">+1 h</button>
        </div>

        <select id="time-speed-select" class="hud-select speed-select mono" aria-label="Vitesse d'écoulement du temps" title="Cadence temporelle">
          <option value="1">1×</option>
          <option value="10">10×</option>
          <option value="60">60× (1 min/s)</option>
          <option value="300">300× (5 min/s)</option>
          <option value="1800">1800× (30 min/s)</option>
          <option value="3600">3600× (1 h/s)</option>
        </select>
      </div>
    </footer>

    <!-- ====================================================================
         COMMAND PALETTE OVERLAY (⌘K / Ctrl-K)
         ==================================================================== -->
    <div id="cmd-palette-overlay" class="cmd-overlay hidden" role="dialog" aria-modal="true" aria-label="Palette de commandes">
      <div class="cmd-card">
        <div class="cmd-input-row">
          <svg class="cmd-search-icon" viewBox="0 0 24 24" width="16" height="16">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input type="text" id="cmd-search-input" placeholder="Rechercher un astre (M31, Sirius, NGC 7000, ISS, Cérès…) ou une action…" autocomplete="off">
          <kbd>ESC</kbd>
        </div>
        <div id="cmd-results-list" class="cmd-results"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
